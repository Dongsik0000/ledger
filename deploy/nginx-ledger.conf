# /etc/nginx/snippets/ledger.conf 로 복사하고, /etc/nginx/sites-available/default 의 server 블록 안에
#   include /etc/nginx/snippets/ledger.conf;
# 를 추가한다. limit_req 영역은 deploy/nginx-ledger-limit.conf (http 블록, /etc/nginx/conf.d/) 에 있다.
# 검증: sudo nginx -t && sudo systemctl reload nginx

location /p3/ {
    proxy_pass         http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # 요청 본문은 JSON 몇 KB 뿐이다 (파일 업로드 없음)
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # 로그인·가입 시도 속도 제한 (앱의 5회 실패 5분 차단과 별개로 IP 단위)
    location ~ ^/p3/auth/(login|signup)$ {
        limit_req        zone=ledger_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

location = /p3 {
    return 301 /p3/;
}
